<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
}

header{
    background:linear-gradient(135deg,#6C63FF,#4A90E2);
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

#cart-count{
    background:white;
    color:#6C63FF;
    padding:3px 8px;
    border-radius:20px;
}

.hero{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:80px 8%;
    background:white;
}

.hero h1{
    font-size:50px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    color:#555;
    max-width:650px;
    margin:auto;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:#6C63FF;
    color:white;
    padding:15px 30px;
    text-decoration:none;
    border-radius:30px;
}

.products{
    padding:70px 8%;
}

.products h2{
    text-align:center;
    font-size:40px;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    font-size:23px;
}

.price{
    font-size:28px;
    font-weight:bold;
    color:#6C63FF;
    margin:15px 0;
}

.buy{
    width:100%;
    padding:12px;
    border:none;
    background:#6C63FF;
    color:white;
    font-size:17px;
    border-radius:8px;
    cursor:pointer;
}

.buy:hover{
    background:#4A90E2;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
}

</style>
</head>

<body>

<header>

<div class="logo">
MyStore
</div>

<nav>

<a href="index.html">Home</a>

<a href="#products">
Products
</a>

<a href="cart.html">
🛒 Cart
<span id="cart-count">0</span>
</a>

</nav>

</header>


<section class="hero">

<div>

<h1>Premium Products</h1>

<p>
High quality products at affordable prices.
Choose your favorite product and add it to your cart.
</p>

<a href="#products" class="btn">
Shop Now
</a>

</div>

</section>


<section class="products" id="products">

<h2>Our Products</h2>

<div class="grid">


<!-- PRODUCT 1 -->

<div class="card">

<img
src="images/product1.jpeg"
alt="Premium Product"
>

<div class="card-content">

<h3>
Premium Product
</h3>

<div class="price">
$1
</div>

<button
class="buy"
onclick="addCart(
'Premium Product',
1,
'images/product1.jpeg'
)"
>
Add To Cart
</button>

</div>

</div>


<!-- PRODUCT 2 -->

<div class="card">

<img
src="images/product2.jpeg"
alt="VIP Product"
>

<div class="card-content">

<h3>
VIP Product
</h3>

<div class="price">
$2
</div>

<button
class="buy"
onclick="addCart(
'VIP Product',
2,
'images/product2.jpeg'
)"
>
Add To Cart
</button>

</div>

</div>


<!-- PRODUCT 3 -->

<div class="card">

<img
src="images/product3.jpeg"
alt="Premium Special Product"
>

<div class="card-content">

<h3>
Premium Special
</h3>

<div class="price">
$3
</div>

<button
class="buy"
onclick="addCart(
'Premium Special',
3,
'images/product3.jpeg'
)"
>
Add To Cart
</button>

</div>

</div>


</div>

</section>


<footer>

<h3>MyStore</h3>

<p>
Fun Project © 2026
</p>

</footer>


<script src="js/app.js"></script>

</body>

</html>
