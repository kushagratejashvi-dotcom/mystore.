<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore | Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
}

header{
    background:linear-gradient(135deg,#6C63FF,#4A90E2);
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.cart{
    max-width:800px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:10px;
}

.item-info{
    flex:1;
}

.item-info h3{
    margin-bottom:10px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:32px;
    height:32px;
    border:none;
    border-radius:6px;
    background:#6C63FF;
    color:white;
    cursor:pointer;
}

.remove{
    border:none;
    background:#e74c3c;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.total{
    text-align:right;
    font-size:26px;
    font-weight:bold;
    color:#6C63FF;
    margin-top:25px;
}

.checkout{
    display:block;
    text-align:center;
    background:#6C63FF;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    margin-top:25px;
}

.empty{
    text-align:center;
    padding:30px;
}

.shop{
    display:inline-block;
    margin-top:20px;
    background:#6C63FF;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<header>

<div class="logo">
MyStore
</div>

<nav>

<a href="index.html">
Home
</a>

<a href="cart.html">
🛒 Cart
</a>

</nav>

</header>


<div class="cart">

<h1>🛒 Your Cart</h1>

<div id="cart-items"></div>

<div
class="total"
id="cart-total">
Total: $0
</div>

<a
href="checkout.html"
class="checkout"
id="checkout-button">
Proceed to Checkout
</a>

</div>


<script>

function getCart(){

return JSON.parse(
localStorage.getItem("cart")
) || [];

}


function saveCart(cart){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

}


function displayCart(){

let cart = getCart();

let container =
document.getElementById("cart-items");

let total = 0;

container.innerHTML = "";


if(cart.length === 0){

container.innerHTML = `

<div class="empty">

<h2>Your cart is empty</h2>

<a
href="index.html"
class="shop">
Shop Now
</a>

</div>

`;

document.getElementById(
"cart-total"
).innerText = "Total: $0";

document.getElementById(
"checkout-button"
).style.display = "none";

return;

}


document.getElementById(
"checkout-button"
).style.display = "block";


cart.forEach(function(product,index){

let quantity =
product.quantity || 1;

let itemTotal =
product.price * quantity;

total += itemTotal;


container.innerHTML += `

<div class="cart-item">

<img
src="${product.image}"
alt="${product.name}"
>

<div class="item-info">

<h3>
${product.name}
</h3>

<p>
$${product.price} each
</p>

</div>

<div class="quantity">

<button
onclick="changeQuantity(${index},-1)">
-
</button>

<span>
${quantity}
</span>

<button
onclick="changeQuantity(${index},1)">
+
</button>

</div>

<strong>
$${itemTotal}
</strong>

<button
class="remove"
onclick="removeProduct(${index})">
Remove
</button>

</div>

`;

});


document.getElementById(
"cart-total"
).innerText =
"Total: $" + total;

}


function changeQuantity(index,change){

let cart = getCart();

cart[index].quantity += change;


if(cart[index].quantity <= 0){

cart.splice(index,1);

}


saveCart(cart);

displayCart();

}


function removeProduct(index){

let cart = getCart();

cart.splice(index,1);

saveCart(cart);

displayCart();

}


displayCart();

</script>

</body>

</html>
