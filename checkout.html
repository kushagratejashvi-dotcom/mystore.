<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore | Checkout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
    padding:30px;
}

.checkout{
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.order{
    background:#f3f3f3;
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
}

.order h2{
    margin-bottom:15px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid #ddd;
}

.total{
    text-align:right;
    font-size:24px;
    font-weight:bold;
    color:#6C63FF;
    margin-top:20px;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:#6C63FF;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#4A90E2;
}

.empty{
    text-align:center;
    padding:20px;
}

.empty a{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:#6C63FF;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>


<div class="checkout">

<h1>🛒 Checkout</h1>


<div class="order">

<h2>Selected Products</h2>

<div id="order-list"></div>

<div
class="total"
id="total">
Total: $0
</div>

</div>


<form
action="https://formsubmit.co/kushagratejashvi@gmail.com"
method="POST"
>

<input
type="hidden"
name="_subject"
value="🎉 New MyStore Order"
>

<input
type="hidden"
name="_template"
value="table"
>

<input
type="hidden"
name="_captcha"
value="false"
>

<input
type="hidden"
name="Order Details"
id="order-details"
>

<input
type="hidden"
name="Total"
id="order-total"
>


<button type="submit">
🎉 Place Order
</button>

</form>

</div>


<script>

function getCart(){

return JSON.parse(
localStorage.getItem("cart")
) || [];

}


function showOrder(){

let cart = getCart();

if(cart.length === 0){

window.location.href = "index.html";

return;

}


let list =
document.getElementById("order-list");

let details =
document.getElementById("order-details");

let totalInput =
document.getElementById("order-total");

let total = 0;

let orderText = "";

list.innerHTML = "";


cart.forEach(function(product){

let quantity =
product.quantity || 1;

let itemTotal =
product.price * quantity;

total += itemTotal;


list.innerHTML += `

<div class="order-item">

<span>
${product.name} × ${quantity}
</span>

<strong>
$${itemTotal}
</strong>

</div>

`;


orderText +=
"Product: " +
product.name +
" | Quantity: " +
quantity +
" | Price: $" +
product.price +
" | Total: $" +
itemTotal +
"\n";

});


document.getElementById(
"total"
).innerText =
"Total: $" + total;


details.value =
orderText;

totalInput.value =
"$" + total;

}


showOrder();

</script>

</body>

</html>
